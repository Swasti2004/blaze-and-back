services:
  - type: web
    name: touch-grass-planner
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TG_SEARCH_RADIUS_M
        value: 3000
